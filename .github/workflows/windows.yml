name: Windows x64 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-launcher-rs-windows-x64
          path: target/x86_64-pc-windows-msvc/release/llama-server-launcher-rs.exe
          if-no-files-found: error
          retention-days: 14
