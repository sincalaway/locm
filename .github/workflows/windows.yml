name: Windows x64 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    name: Build Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release executable
        run: cargo build --release --locked --bin llama-server-launcher-rs --target x86_64-pc-windows-msvc

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-server-launcher-rs-windows-x64
          path: target/x86_64-pc-windows-msvc/release/llama-server-launcher-rs.exe
          if-no-files-found: error
          retention-days: 14
  windows-x64-gnu-cross:
    name: Cross-build Windows x64 GNU desktop from Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust and Windows GNU target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install --yes gcc-mingw-w64-x86-64
      - name: Build with the maintained Kernel32 linker normalization
        run: ./scripts/build-windows-gnu.sh
      - name: Verify Windows x64 executable format
        run: x86_64-w64-mingw32-objdump -f target/x86_64-pc-windows-gnu/release/local-engine-manager.exe | grep 'pei-x86-64'
