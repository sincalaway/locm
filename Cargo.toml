[package]
name = "llama-server-launcher-rs"
version = "0.2.11"
edition = "2021"
description = "Minimal Rust launcher with verified local inference runtime installers"
license = "MIT"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-plugin-dialog"]

[[bin]]
name = "local-engine-manager"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
sysinfo = "0.35"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
tauri = { version = "2.12.6", optional = true, features = [] }
tauri-plugin-dialog = { version = "2", optional = true }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }
